[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otp-bot"
version = "1.0.0"
description = "Telegram OTP bot — Python port of the Spring Boot version"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nikolay Panyukov" }]
license = { text = "Proprietary" }
dependencies = [
    "aiogram>=3.4,<4",
    "aiokafka>=0.10,<0.13",
    "aiohttp>=3.9,<4",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
]

[project.scripts]
otp-bot = "otp_bot.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otp_bot"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
